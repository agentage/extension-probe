name: Release

# A v* tag: the kit tool builds and pushes one image per part to GHCR, the build record with the
# digests becomes the release asset agentage-extension.json, then the package is published to npm
# with OIDC trusted publishing (npmjs.com trusted publisher = this file). No NPM_TOKEN anywhere.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  # TEMPORARY until @agentage/extension and @agentage/cli 0.41 are on npm: the kit and its build
  # tool come from agentage/platform at this commit. Delete with scripts/kit-lock.mjs.
  PLATFORM_SHA: 2f76162436a2aa357889eb9f22e58f530916ed93

jobs:
  release:
    name: Images, record, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: The tag is the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Where the kit and the tool come from
        id: kit
        run: |
          kit=$(npm view '@agentage/extension@0.1.0' version 2>/dev/null || true)
          cli=$(npm view '@agentage/cli@^0.41' version 2>/dev/null | tail -1 || true)
          echo "kit-on-npm=$([ -n "$kit" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "cli-on-npm=$([ -n "$cli" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: TEMPORARY - checkout agentage/platform at the pinned commit
        if: steps.kit.outputs.kit-on-npm != 'true' || steps.kit.outputs.cli-on-npm != 'true'
        uses: actions/checkout@v7
        with:
          repository: agentage/platform
          ref: ${{ env.PLATFORM_SHA }}
          path: .platform

      - name: TEMPORARY - build the kit from the platform checkout
        if: steps.kit.outputs.kit-on-npm != 'true' || steps.kit.outputs.cli-on-npm != 'true'
        working-directory: .platform
        run: |
          npm ci && npm run build
          mkdir -p ../.kit && npm pack -w @agentage/extension --pack-destination ../.kit

      - name: TEMPORARY - point the lockfile at the packed kit
        if: steps.kit.outputs.kit-on-npm != 'true'
        run: node scripts/kit-lock.mjs local .kit/agentage-extension-0.1.0.tgz

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the images, write the record
        run: |
          if [ "${{ steps.kit.outputs.cli-on-npm }}" = "true" ]; then
            npx --yes @agentage/cli@^0.41 extension build --push
          else
            node .platform/packages/extension/dist/tool/cli.js build --push # TEMPORARY fallback
          fi
          cat dist/agentage-extension.json

      - name: Release asset agentage-extension.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/agentage-extension.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/agentage-extension.json \
              --title "$GITHUB_REF_NAME" --notes "Images by digest: agentage-extension.json"
          fi

      - name: TEMPORARY - publish with the registry range, never the local tarball
        if: steps.kit.outputs.kit-on-npm != 'true'
        run: node scripts/kit-lock.mjs registry

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version # OIDC needs npm >= 11.5.1

      - name: Publish to npm (skips a version already published)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm"
            exit 0
          fi
          npm publish --access public --provenance
