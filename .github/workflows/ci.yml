name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

  local:
    name: up and the e2e gate on local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      # agentage/e2e is private (the org PAT_TOKEN reads it); Dependabot runs get no secrets.
      - name: Checkout agentage/e2e
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          repository: agentage/e2e
          path: e2e-suite
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Install agentage/e2e and Chromium
        if: github.actor != 'dependabot[bot]'
        run: |
          npm ci --prefix e2e-suite --no-audit --no-fund
          npx --prefix e2e-suite playwright install --with-deps chromium

      - name: agentage extension up (the release recipes, store, dev issuer, gateway)
        run: |
          # TEMPORARY: the kit's own tool until cli 0.41 (agentage extension up) is on npm
          if npm view '@agentage/cli@^0.41' version >/dev/null 2>&1; then
            npx --yes @agentage/cli@^0.41 extension up
          else
            node node_modules/@agentage/extension/dist/tool/cli.js up
          fi

      - name: Image smoke (each part carries this commit, /health ok on loopback)
        run: scripts/image-smoke.sh "$GITHUB_SHA"

      - name: Smoke through the local gateway (e2e/smoke.spec.ts)
        run: npm run test:e2e

      - name: e2e gate on local (agentage/e2e, probe gate local)
        if: github.actor != 'dependabot[bot]'
        working-directory: e2e-suite
        env:
          PROBE_DIR: ${{ github.workspace }}
        run: npm run e2e -- probe gate local

      - name: Logs on failure
        if: failure()
        run: docker compose -p agentage-probe logs --no-color --tail 80 || true
