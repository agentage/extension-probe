name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify and image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

      - name: Build the api image with the kit tool
        run: |
          # TEMPORARY: the kit's own tool until cli 0.41 (agentage extension build) is on npm
          if npm view '@agentage/cli@^0.41' version >/dev/null 2>&1; then
            npx --yes @agentage/cli@^0.41 extension build
          else
            node node_modules/@agentage/extension/dist/tool/cli.js build
          fi

      - name: Start the image, wait for its HEALTHCHECK
        run: |
          set -euo pipefail
          image="ghcr.io/agentage/probe-api:$(node -p "require('./package.json').version")"
          docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image" | grep -qx "$GITHUB_SHA"
          docker run -d --name probe-api --network host "$image"
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' probe-api)
            echo "attempt $i/30: $state"
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          test "$state" = "healthy"

      - name: Image smoke (e2e/smoke.spec.ts against the container)
        env:
          PROBE_BASE_URL: http://127.0.0.1:3000
          COMMIT_SHA: ${{ github.sha }}
        run: npm run test:e2e

      - name: Container log on failure
        if: failure()
        run: docker logs probe-api || true
