name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

  local:
    name: up and the e2e gate on local
    runs-on: ubuntu-latest
    # The gate on local stays under 10 minutes (about 3 on 2026-11-06); slower is a regression.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install (and Chromium for the widget test; the runner has its OS libraries)
        run: |
          npm ci
          npx playwright install chromium

      # agentage/e2e is private (the org PAT_TOKEN reads it); Dependabot runs get no secrets.
      - name: Checkout agentage/e2e
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          repository: agentage/e2e
          path: e2e-suite
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Install agentage/e2e
        if: github.actor != 'dependabot[bot]'
        run: |
          npm ci --prefix e2e-suite --no-audit --no-fund
          npx --prefix e2e-suite playwright install chromium

      # The cli and its kit come from this lockfile: a cli or kit patch needs a probe commit.
      - name: agentage extension up (the release recipes, store, dev issuer, gateway)
        run: node_modules/.bin/agentage extension up

      - name: Image smoke (each part carries this commit, /health ok on loopback)
        run: scripts/image-smoke.sh "$GITHUB_SHA"

      - name: Smoke and the widget a11y test through the local gateway (e2e/)
        run: npm run test:e2e

      - name: e2e gate on local (agentage/e2e, probe gate local)
        if: github.actor != 'dependabot[bot]'
        working-directory: e2e-suite
        env:
          PROBE_DIR: ${{ github.workspace }}
        run: npm run e2e -- probe gate local

      # A gate that skipped itself is not green (55 executed on 2026-11-06); the cli part tests need PROBE_DIR.
      - name: Assert the gate was not vacuous and read this checkout
        if: github.actor != 'dependabot[bot]'
        working-directory: e2e-suite
        env:
          MIN_EXECUTED: '30'
        run: |
          set -euo pipefail
          node scripts/assert-executed.mjs
          ran=$(jq '[.. | objects | select(.specs?) | .specs[] | select(.file | test("probe/p0/cli")) | .tests[] | select(.status != "skipped")] | length' reports/results.json)
          echo "cli part tests executed: $ran"
          test "$ran" -gt 0

      - name: Logs on failure
        if: failure() || cancelled()
        run: docker compose -f .agentage/compose.json logs --no-color --tail 80 || true
