name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # TEMPORARY until @agentage/extension and @agentage/cli 0.41 are on npm: the kit and its build
  # tool come from agentage/platform at this commit. Delete with scripts/kit-lock.mjs.
  PLATFORM_SHA: 2f76162436a2aa357889eb9f22e58f530916ed93

jobs:
  verify:
    name: Verify and image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Where the kit and the tool come from
        id: kit
        run: |
          kit=$(npm view '@agentage/extension@0.1.0' version 2>/dev/null || true)
          cli=$(npm view '@agentage/cli@^0.41' version 2>/dev/null | tail -1 || true)
          echo "kit-on-npm=$([ -n "$kit" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "cli-on-npm=$([ -n "$cli" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: TEMPORARY - checkout agentage/platform at the pinned commit
        if: steps.kit.outputs.kit-on-npm != 'true' || steps.kit.outputs.cli-on-npm != 'true'
        uses: actions/checkout@v7
        with:
          repository: agentage/platform
          ref: ${{ env.PLATFORM_SHA }}
          path: .platform

      - name: TEMPORARY - build the kit from the platform checkout
        if: steps.kit.outputs.kit-on-npm != 'true' || steps.kit.outputs.cli-on-npm != 'true'
        working-directory: .platform
        run: |
          npm ci && npm run build
          mkdir -p ../.kit && npm pack -w @agentage/extension --pack-destination ../.kit

      - name: TEMPORARY - point the lockfile at the packed kit
        if: steps.kit.outputs.kit-on-npm != 'true'
        run: node scripts/kit-lock.mjs local .kit/agentage-extension-0.1.0.tgz

      - name: Install
        run: npm ci

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

      - name: Build the api image with the kit tool
        run: |
          if [ "${{ steps.kit.outputs.cli-on-npm }}" = "true" ]; then
            npx --yes @agentage/cli@^0.41 extension build
          else
            node .platform/packages/extension/dist/tool/cli.js build # TEMPORARY fallback
          fi

      - name: Image smoke - healthy, /health commit, echo envelope
        run: |
          set -euo pipefail
          docker run -d --name probe-api --network host ghcr.io/agentage/probe-api:0.1.0
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' probe-api)
            echo "attempt $i/30: $state"
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          test "$state" = "healthy"
          commit=$(curl -fsS http://127.0.0.1:3000/health | jq -r .data.commit)
          echo "health commit $commit, wanted $GITHUB_SHA"
          test "$commit" = "$GITHUB_SHA"
          echo=$(curl -fsS 'http://127.0.0.1:3000/api/v1/echo?msg=hi')
          echo "echo: $echo"
          test "$echo" = '{"success":true,"data":{"msg":"hi"}}'
          docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' probe-api | grep -qx "$GITHUB_SHA"

      - name: Container log on failure
        if: failure()
        run: docker logs probe-api || true
